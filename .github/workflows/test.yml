name: IPTV Collector Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "url_policy.py"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q collector.py url_policy.py tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
