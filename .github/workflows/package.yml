name: Build Windows Source Package

on:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "resource_sniffer.py"
      - "url_policy.py"
      - "local_iptv_server.py"
      - "config/**"
      - "tests/**"
      - "README.md"
      - "启动本地IPTV审核工作台.bat"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test
        run: |
          python -m compileall -q collector.py resource_sniffer.py url_policy.py local_iptv_server.py tests
          python -m unittest discover -s tests -v
      - name: Create source package
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=IPTV-Local-Workbench/ HEAD -o dist/IPTV-Local-Workbench.zip
          cd dist
          sha256sum IPTV-Local-Workbench.zip > IPTV-Local-Workbench.zip.sha256
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Local-Workbench-Windows-Source
          path: |
            dist/IPTV-Local-Workbench.zip
            dist/IPTV-Local-Workbench.zip.sha256
          if-no-files-found: error
          retention-days: 30
